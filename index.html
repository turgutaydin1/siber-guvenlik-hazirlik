const LETTERS=['A','B','C','D','E'];
const KEY='kpss_v3_clean_20260816';
let st=JSON.parse(localStorage.getItem(KEY)||'{}'); if(!st.exams) st={exams:{},study:{seen:[],wrong:[],correct:0,total:0}};
let mode='home', curExam=0, qi=0, timer=null, remain=7800, studySession=[], si=0, studyAnswered=false;
function save(){localStorage.setItem(KEY,JSON.stringify(st))}
function $(id){return document.getElementById(id)}
function show(id){for(const x of ['home','exam','result','study','stats'])$(x).classList.add('hidden');$(id).classList.remove('hidden');mode=id}
function tab(id){show(id);document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));if(id==='home')renderHome();if(id==='study')renderStudySetup();if(id==='stats')renderStats()}
function renderHome(){show('home');let h='';DATA.exams.forEach((ex,i)=>{let e=st.exams[i]||{};let status=e.done?`Tamamlandı · ${e.net.toFixed(2)} net`:e.answers?'Devam ediyor':'Başlanmadı';h+=`<div class="card examcard"><h3>Deneme ${i+1}</h3><div class="muted">120 soru · 130 dakika</div><div class="muted" style="margin-top:6px">${status}</div><div class="exam-actions"><button class="btn primary" onclick="startExam(${i})">${e.answers&&!e.done?'Devam Et':e.done?'Sonucu Gör':'Başla'}</button><button class="btn danger" onclick="resetExam(${i})">Sıfırla</button></div></div>`});$('examGrid').innerHTML=h}
function resetExam(i){if(confirm(`Deneme ${i+1} kayıtları silinsin mi?`)){delete st.exams[i];save();renderHome()}}
function resetAll(){if(confirm('Tüm deneme ve çalışma kayıtları silinsin mi?')){localStorage.removeItem(KEY);location.reload()}}
function startExam(i){let e=st.exams[i];if(e&&e.done){curExam=i;renderResult();return}curExam=i;qi=(e&&e.qi)||0;remain=(e&&e.remain)||7800;if(!e)st.exams[i]={answers:Array(120).fill(null),marked:Array(120).fill(false),qi:0,remain:7800,done:false};show('exam');renderQ();clearInterval(timer);timer=setInterval(()=>{remain--;st.exams[curExam].remain=remain;if(remain%10===0)save();renderTimer();if(remain<=0)finishExam()},1000)}
function renderTimer(){$('timer').textContent=String(Math.floor(remain/60)).padStart(2,'0')+':'+String(remain%60).padStart(2,'0')}
function renderQ(){let x=DATA.exams[curExam][qi],e=st.exams[curExam];$('qmeta').textContent=`Deneme ${curExam+1} · Soru ${qi+1}/120 · ${x.subject} / ${x.topic}`;$('stem').textContent=x.stem;$('opts').innerHTML=x.options.map((o,j)=>`<div class="opt ${e.answers[qi]===j?'sel':''}" onclick="answer(${j})"><span class="letter">${LETTERS[j]})</span><span>${o}</span></div>`).join('');e.qi=qi;e.remain=remain;save();renderTimer();renderPalette()}
function answer(j){st.exams[curExam].answers[qi]=j;save();renderQ()}
function nav(d){qi=Math.max(0,Math.min(119,qi+d));renderQ()}
function mark(){let e=st.exams[curExam];e.marked[qi]=!e.marked[qi];save();renderPalette()}
function renderPalette(){let e=st.exams[curExam];$('palette').innerHTML=Array.from({length:120},(_,i)=>`<button class="p ${e.answers[i]!=null?'ans':''} ${i===qi?'cur':''}" onclick="qi=${i};renderQ()">${i+1}</button>`).join('')}
function finishExam(){if(!confirm('Sınav bitirilsin mi?'))return;clearInterval(timer);let ex=DATA.exams[curExam],e=st.exams[curExam];let c=0,w=0,b=0;ex.forEach((x,i)=>{let a=e.answers[i];if(a==null)b++;else if(a===x.answer)c++;else w++});e.correct=c;e.wrong=w;e.blank=b;e.net=c-w/4;e.done=true;save();renderResult()}
function renderResult(){clearInterval(timer);show('result');let e=st.exams[curExam];$('resultTitle').textContent=`Deneme ${curExam+1} Sonucu`;$('metrics').innerHTML=`<div class="metric"><b>${e.correct}</b>Doğru</div><div class="metric"><b>${e.wrong}</b>Yanlış</div><div class="metric"><b>${e.blank}</b>Boş</div><div class="metric"><b>${e.net.toFixed(2)}</b>Net</div>`;let ex=DATA.exams[curExam];let rows='';for(const s of [...new Set(ex.map(x=>x.subject))]){let ids=ex.map((x,i)=>[x,i]).filter(([x])=>x.subject===s);let c=0,w=0,b=0;ids.forEach(([x,i])=>{let a=e.answers[i];if(a==null)b++;else if(a===x.answer)c++;else w++});rows+=`<tr><td>${s}</td><td>${c}</td><td>${w}</td><td>${b}</td><td>${(c-w/4).toFixed(2)}</td></tr>`}$('breakdown').innerHTML=rows}
function answerKey(){let ex=DATA.exams[curExam];$('reviewBox').innerHTML='<div class="card" style="margin-top:12px"><h3>Cevap Anahtarı</h3><div style="display:grid;grid-template-columns:repeat(10,1fr);gap:6px">'+ex.map((x,i)=>`<div style="border:1px solid #d9e1ea;border-radius:7px;padding:7px;text-align:center"><small>${i+1}</small><br><b>${LETTERS[x.answer]}</b></div>`).join('')+'</div></div>'}
function reviewExam(onlyWrong=false){let ex=DATA.exams[curExam],e=st.exams[curExam];let ids=ex.map((x,i)=>i).filter(i=>!onlyWrong||e.answers[i]!==ex[i].answer);let h='';ids.forEach(i=>{let x=ex[i],a=e.answers[i];h+=`<div class="card" style="margin:10px 0"><b>${i+1}. ${x.stem}</b><div style="margin-top:8px">Verilen: <b>${a==null?'Boş':LETTERS[a]}</b> · Doğru: <b>${LETTERS[x.answer]}) ${x.options[x.answer]}</b></div><div class="explain">${x.explanation}</div></div>`});$('reviewBox').innerHTML=h}
function renderStudySetup(){show('study');let subs=[...new Set(DATA.study.map(x=>x.subject))];$('studySubj').innerHTML='<option value="all">Karışık</option>'+subs.map(s=>`<option>${s}</option>`).join('');$('studySubj').onchange=renderStudyTopics;renderStudyTopics();$('studyBox').innerHTML='<div class="notice">Çalışma havuzu denemelerden ayrıdır. Aynı soru, seçilen havuz tükenmeden yeniden sorulmaz.</div>'}
function renderStudyTopics(){let subj=$('studySubj').value;let topics=[...new Set(DATA.study.filter(x=>subj==='all'||x.subject===subj).map(x=>x.topic))];$('studyTopic').innerHTML='<option value="all">Tüm konular</option>'+topics.map(t=>`<option>${t}</option>`).join('')}
function beginStudy(){let subj=$('studySubj').value,topic=$('studyTopic').value,n=+$('studyCount').value;let pool=DATA.study.filter(x=>(subj==='all'||x.subject===subj)&&(topic==='all'||x.topic===topic));let seen=new Set(st.study.seen||[]);let avail=pool.filter(x=>!seen.has(x.id));if(avail.length<n){for(const x of pool)seen.delete(x.id);st.study.seen=[...seen];avail=pool.slice()}for(let i=avail.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[avail[i],avail[j]]=[avail[j],avail[i]]}studySession=avail.slice(0,n);si=0;studyAnswered=false;renderStudyQ()}
function renderStudyQ(){let x=studySession[si];if(!x){$('studyBox').innerHTML='<div class="panel"><h3>Çalışma tamamlandı.</h3><button class="btn primary" onclick="renderStudySetup()">Yeni Çalışma</button></div>';return}$('studyBox').innerHTML=`<div class="question"><div class="muted">${si+1}/${studySession.length} · ${x.subject} / ${x.topic}</div><div class="stem">${x.stem}</div><div class="opts" id="sopts">${x.options.map((o,j)=>`<div class="opt" onclick="studyAnswer(${j})"><span class="letter">${LETTERS[j]})</span><span>${o}</span></div>`).join('')}</div><div id="sexp"></div></div>`}
function studyAnswer(j){if(studyAnswered)return;studyAnswered=true;let x=studySession[si];let ok=j===x.answer;st.study.total++;if(ok)st.study.correct++;if(!ok&&!st.study.wrong.includes(x.id))st.study.wrong.push(x.id);if(ok&&st.study.wrong.includes(x.id))st.study.wrong=st.study.wrong.filter(z=>z!==x.id);if(!st.study.seen.includes(x.id))st.study.seen.push(x.id);save();document.querySelectorAll('#sopts .opt').forEach((el,k)=>{if(k===x.answer)el.classList.add('correct');else if(k===j)el.classList.add('wrong')});$('sexp').innerHTML=`<div class="explain"><b>${ok?'Doğru':'Yanlış'}.</b> Doğru cevap: ${LETTERS[x.answer]}) ${x.options[x.answer]}<br>${x.explanation}<br><button class="btn primary" style="margin-top:9px" onclick="si++;studyAnswered=false;renderStudyQ()">Sonraki</button></div>`}
function wrongs(){let ids=new Set(st.study.wrong||[]);let arr=DATA.study.filter(x=>ids.has(x.id));show('study');$('studyBox').innerHTML=arr.length?arr.map(x=>`<div class="card" style="margin:8px 0"><b>${x.stem}</b><div class="explain">Doğru: ${LETTERS[x.answer]}) ${x.options[x.answer]}<br>${x.explanation}</div></div>`).join(''):'<div class="notice">Çalışma modunda kayıtlı yanlış soru yok.</div>'}
function renderStats(){show('stats');let done=Object.values(st.exams).filter(x=>x.done);let avg=done.length?done.reduce((a,b)=>a+b.net,0)/done.length:0;let rate=st.study.total?100*st.study.correct/st.study.total:0;$('statsBox').innerHTML=`<div class="result-grid"><div class="metric"><b>${done.length}</b>Tamamlanan Deneme</div><div class="metric"><b>${avg.toFixed(2)}</b>Ortalama Net</div><div class="metric"><b>${st.study.total}</b>Çalışma Sorusu</div><div class="metric"><b>%${rate.toFixed(1)}</b>Çalışma Doğruluğu</div></div><div class="notice">Bu sürüm yeni ve temiz soru bankasını kullanır; önceki hatalı sürümün sonuçları taşınmamıştır.</div>`}
async function initData(){const bytes=Uint8Array.from(atob(DATA_GZ_B64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();DATA=JSON.parse(text);renderHome()} window.addEventListener('load',()=>initData().catch(e=>{document.body.innerHTML='<div style=\"padding:24px;font-family:sans-serif\"><h2>Veri yükleme hatası</h2><p>'+e.message+'</p></div>'}));
</script></body></html>
